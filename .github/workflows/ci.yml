name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      # Dummy values so typecheck/lint/build run without real credentials.
      # The server never connects to the DB at build time (pg Pool is lazy).
      DATABASE_URL: postgresql://referaly:referaly@localhost:5432/referaly
      BETTER_AUTH_SECRET: ci-dummy-secret-not-used-for-real
      BETTER_AUTH_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
